<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password | DoWell UX Living Lab</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: radial-gradient(circle at top, #1e293b, #020617);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center text-white">

    <!-- Card -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">

        <!-- Header -->
        <div class="text-center mb-6">
            <img src="/static/images/dowelllogo.png" class="h-12 mx-auto mb-3">
            <h1 class="text-2xl font-bold text-green-400">
                Forgot your password?
            </h1>
            <p class="text-gray-400 mt-2 text-sm">
                Enter your registered email. We’ll send you a reset link.
            </p>
        </div>

        <!-- Form -->
        <form onsubmit="handleForgot(event)" class="space-y-5">

            <!-- Email -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Email address</label>
                <input
                    type="email"
                    id="email"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-green-500"
                    placeholder="you@example.com"
                />
            </div>

            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-green-500 hover:bg-green-600 text-black font-semibold py-3 rounded-xl transition"
            >
                Send Reset Link
            </button>
        </form>

        <!-- Back to Login -->
        <div class="text-center mt-6">
            <a href="/login" class="text-green-400 hover:underline text-sm">
                ← Back to login
            </a>
        </div>

        <!-- Footer -->
        <p class="text-xs text-gray-500 text-center mt-6">
            © 2025 DoWell UX Living Lab
        </p>
    </div>

    <script>
        async function handleForgot(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;

            // TODO: connect backend API
            alert("Password reset link sent to " + email);
        }
    </script>

</body>
</html>
