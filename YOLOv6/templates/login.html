<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | DoWell UX Living Lab</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: radial-gradient(circle at top, #1e293b, #020617);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center text-white">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">

        <!-- Logo -->
        <div class="text-center mb-6">
            <img src="/static/images/dowelllogo.png" class="h-12 mx-auto mb-3" />
            <h1 class="text-2xl font-bold text-green-400">
                DoWell UX Living Lab
            </h1>
            <p class="text-sm text-gray-400">
                Sign in to your account
            </p>
        </div>

        <!-- Login Form -->
        <form class="space-y-5">

            <div>
                <label class="block text-sm mb-1 text-gray-300">Email</label>
                <input
                    type="email"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-green-500 focus:outline-none"
                    placeholder="you@example.com"
                />
            </div>

            <div>
                <label class="block text-sm mb-1 text-gray-300">Password</label>
                <input
                    type="password"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-green-500 focus:outline-none"
                    placeholder="••••••••"
                />
            </div>

            <!-- Forgot Password -->
            <div class="flex justify-end text-sm">
                <a href="/forgotpassword" class="text-green-400 hover:underline">
                    Forgot password?
                </a>
            </div>

            <button
                type="submit"
                class="w-full bg-green-500 hover:bg-green-600 text-black font-semibold py-3 rounded-xl transition"
            >
                Log In
            </button>
        </form>

        <!-- Register -->
        <p class="text-center text-sm text-gray-400 mt-6">
            New user?
            <a href="/register" class="text-green-400 hover:underline font-medium">
                Create an account
            </a>
        </p>

        <!-- Footer -->
        <p class="text-xs text-gray-500 text-center mt-6">
            © 2025 DoWell UX Living Lab
        </p>
    </div>

</body>
</html>
