<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | DoWell UX Living Lab</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: radial-gradient(circle at top, #1e293b, #020617);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center text-white">

<div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">

    <div class="text-center mb-6">
        <img src="/static/images/dowelllogo.png" class="h-12 mx-auto mb-3" />
        <h1 class="text-2xl font-bold text-green-400">DoWell UX Living Lab</h1>
        <p class="text-sm text-gray-400">Sign in to your account</p>
    </div>

    <form id="loginForm" class="space-y-5">

        <div>
            <label class="block text-sm mb-1 text-gray-300">Email</label>
            <input id="email" type="email" required
                   class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-green-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm mb-1 text-gray-300">Password</label>
            <input id="password" type="password" required
                   class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-green-500 focus:outline-none">
        </div>

        <p id="error" class="text-red-400 text-sm hidden"></p>

        <div class="flex justify-end text-sm">
            <a href="/forgotpassword" class="text-green-400 hover:underline">
                Forgot password?
            </a>
        </div>

        <button type="submit"
                class="w-full bg-green-500 hover:bg-green-600 text-black font-semibold py-3 rounded-xl">
            Log In
        </button>
    </form>

    <p class="text-center text-sm text-gray-400 mt-6">
        New user?
        <a href="/register" class="text-green-400 hover:underline font-medium">
            Create an account
        </a>
    </p>

    <p class="text-xs text-gray-500 text-center mt-6">
        © 2025 DoWell UX Living Lab
    </p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const error = document.getElementById("error");

    const email = emailInput.value;
    const password = passwordInput.value;

    error.classList.add("hidden");

    try {
        const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || "Login failed");

        localStorage.setItem("access_token", data.access_token);
        window.location.href = "/videoupload";

    } catch (err) {
        error.textContent = err.message;
        error.classList.remove("hidden");
    }
});
</script>


</body>
</html>
