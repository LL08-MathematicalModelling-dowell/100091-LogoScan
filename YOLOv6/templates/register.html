<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Account | DoWell UX Living Lab</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: radial-gradient(circle at top, #1e293b, #020617);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center text-white">

    <!-- Card -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">

        <!-- Header -->
        <div class="text-center mb-6">
            <img src="/static/images/dowelllogo.png" class="h-12 mx-auto mb-3" alt="Logo">
            <h1 class="text-2xl font-bold text-green-400">Create Account</h1>
            <p class="text-sm text-gray-400">
                Start using the video intelligence platform
            </p>
        </div>

        <!-- Register Form -->
        <form id="registerForm" class="space-y-4">

            <!-- First Name -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">First Name</label>
                <input
                    name="firstName"
                    type="text"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-green-500"
                    placeholder="First Name"
                />
            </div>

            <!-- Last Name -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Last Name</label>
                <input
                    name="lastName"
                    type="text"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-green-500"
                    placeholder="Last Name"
                />
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Email</label>
                <input
                    name="email"
                    type="email"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-green-500"
                    placeholder="you@example.com"
                />
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Password</label>
                <input
                    name="password"
                    type="password"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-green-500"
                    placeholder="•••••••••••"
                />
            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="w-full bg-green-500 hover:bg-green-600 text-black font-semibold py-3 rounded-xl transition mt-4"
            >
                Create Account
            </button>
        </form>

        <!-- Back to Login -->
        <div class="text-center mt-6">
            <a href="/login" class="text-green-400 hover:underline text-sm">
                ← Back to login
            </a>
        </div>

        <p class="text-xs text-gray-500 text-center mt-6">
            © 2025 DoWell UX Living Lab
        </p>
    </div>

    <!-- Script -->
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const form = e.target;

            const payload = {
                firstName: form.firstName.value.trim(),
                lastName: form.lastName.value.trim(),
                email: form.email.value.trim(),
                password: form.password.value
            };

            try {
                const res = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.detail || "Registration failed");
                    return;
                }

                alert(data.message);
            } catch (err) {
                alert("Server error. Try again later.");
            }
        });
    </script>

</body>
</html>
